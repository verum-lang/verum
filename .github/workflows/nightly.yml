name: Nightly

on:
  schedule:
    # 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Deep regression sweep — VCS all levels + cross-tier differential + extended
  # fuzz. Not blocking; artifacts + notifications surface regressions.
  # ---------------------------------------------------------------------------
  vcs-full:
    name: VCS full sweep (all levels)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-vcs

      - name: Build runners
        run: cargo build -p vtest -p verum_vfuzz -p vbench -p verum_cli --release --locked

      # The SURVEY half of the type-checker determinism gate (T0927). The PR
      # gate re-checks six cheap files as a tripwire; this one sweeps the full
      # 25-file list, ~14 minutes, which is affordable here and is not on a
      # PR. Advisory: a finding here is a real defect, but it must not block a
      # nightly whose job is measurement.
      - name: Type-checker determinism sweep (full list)
        continue-on-error: true
        run: |
          ../scripts/ci/check_typecheck_determinism.sh --selftest
          ../scripts/ci/check_typecheck_determinism.sh \
            --bin ../target/release/verum \
            --sample ../scripts/ci/typecheck_determinism_sample_full.txt \
            --runs 15
        working-directory: vcs

      # One source, one verdict — across DRIVERS this time. `verum check
      # FILE`, `verum check` in a project, and the stdlib bake compile the
      # same sources; the bake is the softest of the three, so a file it
      # accepts and the checker refuses is a real divergence, not a
      # stricter mood. The gate is a ratchet and was reachable from
      # NOTHING — no workflow, no Makefile target — so its baseline of 6
      # protected nothing (T1073 class). Measured 2026-09-02: still 6, and
      # chasing one of them found 68 core/ files whose umbrella `mount
      # core.{Result}` is refused outright (T1077).
      #
      # Advisory here, like its neighbour: it needs a built binary and
      # ~10 minutes, and a finding is a defect to file rather than a
      # branch to block.
      - name: File-vs-project-vs-bake parity (ratchet)
        continue-on-error: true
        run: |
          python3 scripts/ci/check_file_vs_project_parity.py \
            --verum target/release/verum

      # The panic-stub ratchet, and the same T1073 class as its neighbour
      # above: `scripts/ci/check_bake_diagnostics.py` is correct,
      # self-documented, wired to `make check-bake-diagnostics`, and
      # reachable from NOTHING — it wants a bake LOG (a bake is ~12 min, so
      # it deliberately does not bake itself) and no job produced one. The
      # count drifted from its baseline of 2 to ELEVEN unobserved.
      #
      # The bake's own diagnostics are invisible by default for the reason
      # A-FABRICATE records: the stdlib is baked inside `verum_compiler`'s
      # build.rs, and cargo hides build-script output on a successful build.
      # A DIRECT `verum stdlib precompile` is the only way to see them.
      #
      # Advisory, and it will be RED on its first run — 11 against a
      # baseline of 2 (T1315 has the taxonomy: 4 names that exist nowhere,
      # 5 that exist but not as written, 2 genuine body errors). THE
      # BASELINE MUST NOT BE RAISED TO MATCH: a ratchet lowered by argument
      # is not a ratchet, and raising this one would bless nine regressions
      # in the act of repairing the gate. It comes down by fixing (T1315).
      - name: Stdlib bake diagnostics (ratchet, advisory)
        continue-on-error: true
        env:
          # Turns the stage-5 mint site's trace on, so ONE bake feeds BOTH
          # ratchets below. Costs ~580 extra log lines and no extra time.
          VERUM_TRACE_QCALL: "1"
        run: |
          target/release/verum stdlib precompile \
            --stdlib-path core -o /tmp/nightly-bake.vbca > /tmp/bake.log 2>&1 || true
          echo "bake log: $(wc -l < /tmp/bake.log) lines"
          make check-bake-diagnostics BAKE_LOG=/tmp/bake.log

      # The second ratchet off the SAME log (T1172): how many stage-5 stub
      # ids stand for more than one name. A mount miss in one function
      # installs a stub in the shared slot under the SIMPLE name,
      # authoritatively, and every later call of that name in the unit
      # resolves to it — so one id ends up meaning many qualified targets
      # (measured: 23 names on 4269801471) and the runtime diagnostic
      # `stub never resolved id=…` cannot name the offender.
      #
      # READ THE DIRECTION; THE MAGNITUDE IS NOT A DEFECT COUNT. The census
      # shows why: on this tree ONE id stands for five unrelated names
      # (InvalidInput, NotFound, access_name, flags_default,
      # open_readonly), so stub LINES and distinct roots are different
      # quantities. The one delta measured so far is 1:1 — repairing one
      # dead name moved another session's stub count by exactly one — which
      # says the ratio CAN be one, not that it always is.
      - name: Stage-5 stub sharing (ratchet, advisory)
        continue-on-error: true
        run: make check-stage5-stub-sharing BAKE_LOG=/tmp/bake.log

      - name: Run VCS L0+L1+L2+L3 full
        working-directory: vcs
        # The vtest RUNNER process (not a test child) has died SIGSEGV
        # ~50 min into this sweep (T0837). It does not reproduce on
        # darwin at either scale (full sweep clean, RSS peak 4.7 GB),
        # so the crash must be caught where it lives: cores on, and
        # the autopsy step below turns a corpse into a backtrace.
        run: |
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern="$PWD/core.%e.%p" >/dev/null
          make test PARALLEL=4

      - name: Backtrace any core dump (T0837)
        if: failure()
        working-directory: vcs
        run: |
          shopt -s nullglob
          cores=(core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "no core files — the failure was not a runner crash"
            exit 0
          fi
          sudo apt-get install -y gdb >/dev/null 2>&1 || true
          for c in "${cores[@]}"; do
            echo "=== backtrace for $c ==="
            gdb -batch -ex "thread apply all bt" \
              ../target/release/vtest "$c" 2>&1 | tail -80
          done

      - name: Cross-tier differential (all combos)
        working-directory: vcs
        run: |
          for combo in "0,1" "1,2" "2,3" "0,3"; do
            echo "Testing Tier ${combo%,*} vs Tier ${combo#*,}..."
            cargo run --release -p vtest -- run differential --tier "$combo" --parallel 4 || true
          done

      - name: Upload VCS reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-vcs-reports
          path: vcs/reports/

  # ---------------------------------------------------------------------------
  # Extended fuzzing across all targets.
  # ---------------------------------------------------------------------------
  fuzz:
    name: Fuzz (60m, all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-fuzz

      - name: Build fuzzer
        run: cargo build -p verum_vfuzz --release --locked

      - name: Run fuzzer
        working-directory: vcs
        run: |
          cargo run --release -p verum_vfuzz -- run \
            --targets all --duration 60m --parallel 4 \
            --corpus fuzz/seeds --crashes reports/fuzz-crashes || true

      - name: Upload fuzz crashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-crashes
          path: vcs/reports/fuzz-crashes/

  # ---------------------------------------------------------------------------
  # Benchmark regression check against committed baseline.
  # ---------------------------------------------------------------------------
  bench:
    name: Benchmark (compare vs baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-bench

      - name: Build bench runner
        run: cargo build -p vbench --release --locked

      - name: Run benchmarks and compare
        working-directory: vcs
        run: make bench-compare || true

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bench-report
          path: vcs/reports/

  # NOTE: AOT stress job is deferred until Phase 1.3 lands the module-scope
  # stability gate. vcs/scripts/aot-stress.sh exists and can be run locally
  # (`bash vcs/scripts/aot-stress.sh`); it will be re-wired here once the
  # underlying codegen issue at llvm/instruction.rs is resolved.
