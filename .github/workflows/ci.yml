name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # rust-toolchain.toml pins nightly; honour it in CI.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: Verum-syntax gate. Pure Python, no build — the fastest merge blocker.
  # grammar/verum.ebnf knows only `.` for paths; `::` is a Rust porting artefact
  # the parser only tolerates as error-recovery. This keeps it out of .vr sources
  # (IPv6 / SQL-cast / URI / script DATA excluded). See the script's header.
  # ---------------------------------------------------------------------------
  vr-syntax:
    name: Source gates (syntax, rings, ratchets — no build needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Rust-style `::` in .vr sources
        run: python3 vcs/scripts/check_no_double_colon.py --check
      # instruction.rs is the single source of truth for VBC op bytes; a .vr
      # doc comment that contradicts it is worse than no comment, because the
      # next author writes code against it (T0193 shipped a `3 = log` claim
      # where the enum says 4). Re-derives the enums on every run.
      - name: .vr op-byte doc comments match the instruction.rs enums
        run: python3 vcs/scripts/check_op_byte_docs.py --check
      # Verum has no `str` type — `&str` is Rust leaking into .vr sources.
      # Scoped to core/, which T0663 cleared; core-tests/ and vcs/ still hold
      # real violations and are reported by --check as a census, not gated,
      # because a gate that fires on known-unfixed code gets silenced wholesale.
      - name: No Rust `&str` in core/ .vr code
        run: python3 vcs/scripts/check_no_str_alias.py --gate

      # The stdlib's layering law, as data: `core/rings.toml` declares the
      # rings, the gate measures the actual mount graph against them. A
      # module in ring N depends only on rings < N, and a ring not declared
      # `cohesive` contains no dependency cycles.
      #
      # Added the day it first held — 2026-08-08, 2557 modules and 5275
      # inter-module edges with 0 violations, down from 20 upward edges
      # across 60 mount sites plus 9 cycles. It is worth gating precisely
      # because it is green: an upward edge is trivial to introduce (one
      # `mount`) and invisible without a measurement, and the last nine
      # cycles each turned out to be a real inversion of dependency
      # direction — a certificate type living in the network stack, thread
      # primitives living above the async layer built on them.
      - name: core/ ring law (no upward edges, no cycles)
        run: python3 scripts/ci/check_core_rings.py

      # INVENTORY.md is the per-module conformance truth table, and its
      # structural integrity is what makes the liveness layer possible:
      # rows unique, row <-> test-directory bijection, valid status
      # tokens. Without the bijection a module can run its tests while
      # being ABSENT from the table — measured 2026-08-08, `sys/mod`
      # was exactly that: four *_test.vr files, 39 compile-errors, no
      # row at all.
      #
      # This is the cheap structural half. The liveness half
      # (`--results`, which re-verifies every green claim against a real
      # run) needs a full suite pass — 18,958 tests, ~35 minutes — so it
      # is not a per-PR gate; it is run deliberately and its findings
      # land in the table. Twenty rows claimed a green status they had
      # never earned until that run happened.
      - name: core-tests/INVENTORY.md structural integrity
        run: python3 scripts/ci/check_inventory.py --structural-only

      # EVERY gate that needs only the source tree, in one target.
      # Measured 2026-08-16: TWELVE such gates exist and this job ran
      # five of them — the type-name ratchet, the (name,arity) ratchet
      # in all four of its scopes, the @arch_module attestation ratchet
      # and the bake pre-pass parity gate were reachable from the
      # Makefile and from nothing else, so they held no PR to account.
      # A gate that does not run is a comment.
      #
      # The whole set costs 14 seconds, so it is not worth splitting by
      # cost. `gates-source` is the list — adding a source-only gate
      # there is what wires it, and this step needs no edit.
      - name: All source-only gates (make gates-source)
        run: make gates-source

  # ---------------------------------------------------------------------------
  # Job 1: compile + unit tests on Linux (x86_64 + aarch64) and macOS.
  # Linux-arm64 matters because aarch64 uses a different kernel syscall
  # table from x86_64 — see sys/linux/arch.vr. Blocks merge.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Same rationale as the Integration job: full debuginfo is the
      # bulk of build memory/disk, and no debugger attaches on CI.
      # The arm runner (fewest resources in the matrix) died three
      # runs straight inside «Build workspace» with no surviving logs
      # — the OOM/disk profile this trims. Backtraces keep file:line.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16 (macOS only)
        if: runner.os == 'macOS'
        # The bundled z3-src C++ build fails under the macos-14 image's
        # default Xcode 15 clang ('no matching constructor for
        # initialization of key_data' in obj_hashtable.h); clang 16+
        # compiles the same source cleanly (verified on a local
        # Darwin 25 toolchain). Pick the newest Xcode 16 on the image.
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          clang++ --version

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        run: rustup toolchain install

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit-${{ matrix.os }}
          cache-on-failure: true

      - name: Build workspace (rustc -D warnings, blocking)
        env:
          RUSTFLAGS: "-D warnings"
          # The arm runner keeps dying inside this step. MEASURED, not
          # guessed: with CARGO_BUILD_JOBS=2 the step ran 71 minutes and
          # was still killed — so the constraint is not peak RSS from
          # parallelism, and halving the width only made the job slower
          # (my earlier reading of this failure was wrong and is
          # corrected here rather than left in place). What actually
          # bounds this runner is total work: it builds the whole
          # workspace AND bakes the stdlib inside the build script.
          # Keep full width; cut the WORK instead — codegen-units and no
          # debug info are worth more here than fewer jobs.
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
        run: cargo build --workspace --locked

      - name: Run unit tests (library + binaries)
        # tee + failure artifact: runner log blobs vanish on failures
        # (Azure-side), leaving red steps with zero diagnostics.
        run: cargo test --workspace --lib --bins --locked 2>&1 | tee unit-tests.log; exit ${PIPESTATUS[0]}

      - name: Upload unit test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-log-${{ matrix.os }}
          path: unit-tests.log
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Job 1b (T0709): integration-test gate. `--lib --bins` above excludes the
  # 834 files under crates/*/tests/ — every guard landed there was inert
  # ("landed CI-INERT" class: stop-after-first-error recovery, INVENTORY
  # liveness, speed contracts). This job arms the pure/cheap tier: crates
  # whose tests/ run WITHOUT the AOT toolchain or live network. AOT-heavy
  # suites (verum_cli, verum_codegen e2e) stay excluded here — they need the
  # single-machine no-two-AOT-suites discipline and land in a follow-up
  # nightly lane. Linux-only: the tier is platform-agnostic Rust; the unit
  # matrix already covers OS spread.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Job 1c (T0486, fold of T0394): the three feature-gated verum_vbc
  # guardrail targets. `required-features = ["codegen"]` keeps them out
  # of every default invocation, and their rot was invisible — measured
  # on first arming: one target had stopped COMPILING (v2.12 field
  # E0063) and a ratchet had drifted 280 -> 0 in the improved direction
  # with nothing to pin the gain. They compile the real stdlib under
  # the codegen feature (~85 min measured locally), so they get their
  # own job and timeout rather than the 45-min pure tier.
  # ---------------------------------------------------------------------------
  vbc-guardrails:
    name: verum_vbc feature-gated guardrails (codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        run: rustup toolchain install

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: vbc-guardrails
          cache-on-failure: true

      - name: Run the three gated targets
        timeout-minutes: 120
        run: >
          cargo test --locked -p verum_vbc --features codegen
          --test layout_invariant_verifier_tests
          --test intrinsic_key_resolution_gate
          --test global_type_table_consistency_tests

      # The workspace unit-test job runs with DEFAULT features, and
      # `codegen` is not one of them (verum_vbc/Cargo.toml) — so every
      # inline test under `src/codegen/**` was never executed by CI.
      # Measured 2026-08-19: 1354 tests without the feature, 2071 with
      # it. 717 inline tests, including a canary that calls itself
      # "module compiles and links", had never run.
      #
      # `codegen::test_params` is skipped and only that: those 139 tests
      # compile core/ files and 25 of them fail on the standing stdlib
      # debt (T0766 — `List.from_elem`, `Text.new`, missing field
      # layouts), which predates this job. The other 1932 gate from now
      # on. Narrowing the skip is how that debt gets drained.
      - name: Inline codegen tests (feature-gated, never ran before)
        timeout-minutes: 60
        run: >
          cargo test --locked -p verum_vbc --lib --features codegen
          -- --skip codegen::test_params

  integration:
    name: Integration tests (tests/ gate, pure tier)
    runs-on: ubuntu-latest
    env:
      # Debuginfo is the bulk of test-binary volume; five crate tiers of
      # integration binaries + the baked stdlib overflowed the runner's
      # ~14GB free disk ("No space left on device", run 31112675382).
      # Line tables stay (backtraces keep file:line); full debuginfo is
      # only useful under a debugger, which never attaches on CI.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free runner disk space
        # The hosted image ships ~30GB of unrelated toolchains; reclaim
        # them before the five-tier build (same disk-overflow class).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        run: rustup toolchain install

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-tests
          cache-on-failure: true

      - name: Run tests/ for the pure tier
        # One crate per --package; --tests selects ONLY integration targets
        # (unit surface already gated by Job 1). Timeout guards the
        # suite-never-completes-means-hang class — a wedged suite fails
        # loudly instead of eating the 6h job limit.
        timeout-minutes: 45
        # Measured locally 2026-08-02 (T0709 journal): the 9-crate light
        # tier = 4,363 tests green; verum_fast_parser adds 4,158 (measured same day). verum_kernel is EXCLUDED for now — its
        # k_arch_v_alignment pin is honest-red (160/2480 cogs missing
        # @arch_module attestation, tracked as its own task); a gate that
        # starts red gets silenced wholesale. Heavier pure crates
        # (types/smt/fast_parser/vbc/verification) join after their own
        # timed local run.
        run: >
          cargo test --locked --tests
          -p verum_common -p verum_ast -p verum_lexer
          -p verum_cbgr -p verum_modules
          -p verum_diagnostics -p verum_error -p verum_protocol_types
          -p verum_fast_parser

      # verum_codegen + verum_integration_tests tier: measured green
      # locally 2026-08-07 (85 tests across 7 targets, 12.5s wall).
      #
      # Both crates were outside every `--tests` tier, and the two pins
      # that had to be fixed to get here show what that costs: neither
      # was red — both were UNRUN. `test_cbgr_fat_ref_type_layout`
      # demanded 4 fields from a FatRef the architecture pins at 6
      # (32 bytes: ThinRef + metadata:8 + offset:4 + reserved:4), and
      # `test_llvm_ir_multiple_functions` demanded that 3 functions be
      # lowered when lowering is deliberately SCOPED TO REACHABLE ones
      # (T0682) — it failed exactly when dead code was correctly
      # dropped, i.e. it asked for the 14.4 GB RSS leak back.
      - name: Run tests/ for verum_codegen + integration
        timeout-minutes: 20
        run: cargo test --locked --tests -p verum_codegen -p verum_integration_tests

      # verum_lsp tier: measured green locally 2026-08-07 — 81 tests
      # across 4 targets, 0.03s wall, zero carve-outs.
      #
      # `verum_parser` is NOT here and cannot be yet: 77 of its 78
      # integration tests pass, and the one that does not
      # (test_error_recovery_invalid_expression) asserts that `1 ++ 2`
      # is a syntax error — an open LANGUAGE decision (T0643), since
      # grammar/verum.ebnf has no `++` while L1/L2 specs depend on it
      # working. Silencing it would erase the question; adding the
      # crate red would get the whole tier silenced.
      - name: Run tests/ for verum_lsp
        timeout-minutes: 15
        run: cargo test --locked --tests -p verum_lsp

      # verum_types tier: 1,124 tests green (measured 2026-08-03). The
      # affine pin sat red only because it asserted the pre-recovery
      # error CHANNEL (Err) while STMT-RECOVERY-1 reports through
      # diagnostics — enforcement itself was live (T0713, falsified);
      # the pin now accepts either channel and the carve-out is gone.
      - name: Run tests/ for verum_types
        timeout-minutes: 30
        run: cargo test --locked --tests -p verum_types

      # Doc examples, for the pure tier plus the two crates whose doc
      # comments carry non-Rust snippets. An INDENTED block inside a
      # `///` comment is a Rust code block to rustdoc, which COMPILES it
      # — so a Verum or SMT-LIB example written that way fails to build
      # and reports a rustc error that says nothing about the code it
      # documents. Five such blocks were found and fenced as ```text on
      # 2026-08-28, one of them written the same day the other four were
      # cleared.
      #
      # A token-matching gate was written first and DELETED: it reported
      # clean on the very block it was written for, because a Verum
      # snippet that fails as Rust can be indistinguishable from Rust by
      # inspection (`loop { if i >= n { … } }` is a syntax rustc accepts
      # and a program it cannot resolve). Only the compiler knows what a
      # block MEANS — and the step below is still the only thing that
      # asks that.
      #
      # It is not, however, the whole check, and the sentence that said
      # so was wrong: this step stayed RED on main from 2026-08-28 to
      # 2026-09-01 while the class it guards came back twice. It sees a
      # block only in the four crates it names, and only when the block
      # FAILS to parse — `verum_codegen` and `verum_vbc` held nine more,
      # two of which were accidentally valid Rust and said nothing.
      #
      # So the structural check runs FIRST, and asks a question the
      # compiler cannot: is there an indented block at all? No content
      # is classified, so the deleted gate's failure mode cannot recur,
      # and it carries its own positive control (`--selftest`) because a
      # detector reporting nothing looks exactly like a clean tree.
      - name: Doc comments fence their code blocks
        timeout-minutes: 2
        run: |
          python3 scripts/ci/check_doc_indented_blocks.py --selftest
          python3 scripts/ci/check_doc_indented_blocks.py

      - name: Doc examples compile
        timeout-minutes: 20
        run: cargo test --locked --doc -p verum_types -p verum_smt -p verum_common -p verum_ast -p verum_vbc -p verum_codegen

      # verum_verification tier: 1,537 tests measured green 2026-08-03,
      # zero carve-outs.
      - name: Run tests/ for verum_verification
        timeout-minutes: 30
        run: cargo test --locked --tests -p verum_verification

      # verum_smt tier: 1,759 tests measured green 2026-08-03. Its one
      # flake source (a single-shot 10ms perf pin) was re-grounded as
      # best-of-3 with 50ms headroom in the same landing that arms
      # this step — intent (generation is O(fast)) unchanged.
      - name: Run tests/ for verum_smt
        timeout-minutes: 30
        run: cargo test --locked --tests -p verum_smt

      # verum_vbc tier moved to its own job (integration-vbc): its test
      # binaries are the heaviest of the five tiers (each embeds the
      # baked stdlib), and by this point the runner's disk — even after
      # the reclaim step — was drained by the four earlier tiers' build
      # artifacts. Two runs died mid-step with no surviving logs before
      # the split.

  integration-vbc:
    name: Integration tests (verum_vbc tier)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        run: rustup toolchain install

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-vbc
          cache-on-failure: true

      # verum_vbc tier: 1,717 tests measured green 2026-08-03 after the
      # T0714 landing (envelope-family arms made TOTAL to garbage
      # register values — the debug asserts aborted what release
      # semantics survive) and two ratchets tightened in the same pass
      # (INVENTORY duplicate rows, stdlib duplicate protocol names).
      # Own job = own fresh disk: these binaries each embed the baked
      # stdlib and overflowed the shared runner twice.
      - name: Run tests/ for verum_vbc
        timeout-minutes: 45
        # tee into a file + artifact on failure: the runner's log blobs
        # for this job have vanished on every failure (Azure-side), so
        # the artifact is the only surviving diagnostic channel.
        run: cargo test --locked --tests -p verum_vbc 2>&1 | tee vbc-tests.log; exit ${PIPESTATUS[0]}

      - name: Upload vbc test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vbc-tests-log
          path: vbc-tests.log
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Job 2: VCS L0 (2,963 specs, 100%) + L1 (499 specs, 100%). Blocks merge.
  # ---------------------------------------------------------------------------
  vcs-l0-l1:
    name: VCS L0 + L1 (100% gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: vcs-runner

      - name: Build vtest runner
        run: cargo build -p vtest --release --locked

      - name: Run L0-critical (100% required)
        working-directory: vcs
        # tee + failure artifact — runner log blobs vanish on failures.
        #
        # VTEST_TRACE_SPEC (T0829): the runner has been dying mid-sweep
        # with glibc's `malloc(): invalid size (unsorted)` and SIGABRT,
        # and the log carried no spec path — a result line is printed
        # when a test FINISHES, which is the case a crash denies. This
        # prints the path before each spec runs, so the last lines before
        # the abort name the suspects. Remove once the corruption is
        # located.
        env:
          VTEST_TRACE_SPEC: "1"
        # Cores on: the vtest RUNNER has died SIGSEGV inside/after the
        # aot/ section on this very step (T0837 — last START
        # 1049_barrier_sync.vr, corpse 76 s later) and the log's whole
        # testimony was "Error 139". Same arming as nightly.yml.
        run: |
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern="$PWD/core.%e.%p" >/dev/null
          make test-l0 PARALLEL=4 2>&1 | tee l0.log; exit ${PIPESTATUS[0]}

      - name: Backtrace any L0 core dump (T0837)
        if: failure()
        working-directory: vcs
        run: |
          shopt -s nullglob
          cores=(core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "no core files — the failure was not a runner crash"
            exit 0
          fi
          sudo apt-get install -y gdb >/dev/null 2>&1 || true
          for c in "${cores[@]}"; do
            echo "=== backtrace for $c ==="
            gdb -batch -ex "thread apply all bt" \
              ../target/release/vtest "$c" 2>&1 | tail -80
          done

      - name: Run L1-core (100% required)
        working-directory: vcs
        run: make test-l1 PARALLEL=4 2>&1 | tee l1.log; exit ${PIPESTATUS[0]}

      - name: Upload VCS run logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcs-run-logs
          path: |
            vcs/l0.log
            vcs/l1.log
          retention-days: 3

      - name: Upload VCS reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcs-reports-l0-l1
          path: vcs/reports/

  # ---------------------------------------------------------------------------
  # Job 3: Differential (interpreter vs AOT, 204+ specs). Blocks merge.
  # ---------------------------------------------------------------------------
  differential:
    name: Differential (Tier 0 vs Tier 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: vcs-runner

      - name: Build vtest runner + verum CLI
        run: cargo build -p vtest -p verum_cli --release --locked

      - name: Run differential specs
        working-directory: vcs
        run: make test-differential PARALLEL=4

      - name: Upload differential reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcs-reports-differential
          path: vcs/reports/

  # ---------------------------------------------------------------------------
  # Job 3b: STRICT-gate baseline (#45). AOT-compiles a stdlib-heavy smoke
  # program with VERUM_STRICT_MONO + VERUM_STRICT_SIGNATURES so the two
  # silent-degradation classes (mono fallback-to-unspecialized, arity-
  # collision / skip-body forward declarations) are VISIBLE in CI on every
  # push. Advisory (continue-on-error) until the drift backlog is zero —
  # then remove `continue-on-error` to make it blocking, same lifecycle as
  # the lint job below.
  # ---------------------------------------------------------------------------
  strict-gates:
    name: STRICT gates (mono + signatures, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: vcs-runner

      - name: Build verum CLI
        run: cargo build -p verum_cli --release --locked

      # T0927: `verum check` answered core/logic/kripke.vr with 0 errors on
      # some runs and 20 on others, from one binary on one unedited file, and
      # nothing noticed — every other gate in this file runs a file ONCE, and
      # one run cannot see a verdict that varies. Runs here because this is the
      # job that already has a RELEASE binary; a debug one would make the
      # repeat-N sweep cost more than the job.
      #
      # The self-test runs first and is not decoration: a green sweep and a
      # broken detector look identical from outside. It feeds the same
      # comparison a subject known to vary and fails if the gate calls it
      # stable.
      - name: Type-checker determinism gate
        run: |
          scripts/ci/check_typecheck_determinism.sh --selftest
          scripts/ci/check_typecheck_determinism.sh --bin ./target/release/verum --runs 15

      # T1041, and the sibling question to the one above: that gate asks
      # whether one file gets one verdict across RUNS; this one asks
      # whether it gets one verdict across LOCATIONS. `is_stdlib_file`
      # was a substring test on the input path, so a file in any
      # directory named `core` was checked under the standard library's
      # rules — measured, that changed the verdict for 13 of 25 files in
      # both directions, and this gate's own subject had two real errors
      # SUPPRESSED by sitting in a `core/` folder.
      #
      # Runs here for the same reason as its neighbour: this job already
      # has a release binary. Self-test first, and for the same reason —
      # a comparison that always reports "equal" is indistinguishable
      # from a clean tree.
      - name: File location does not change the verdict
        run: |
          scripts/ci/check_path_does_not_change_verdict.sh --selftest ./target/release/verum
          scripts/ci/check_path_does_not_change_verdict.sh ./target/release/verum

      # T1040, third on the same axis: one file, one verdict — across
      # runs (above), across locations (above), and here across the NAME
      # of a type parameter. `implement Bag<T>` binds T by extracting it
      # from the target type, and the guard asked "is this name free?"
      # rather than "is it occupied by a TYPE" — so every letter some
      # earlier impl had registered stopped working, while an unusual one
      # kept working. Measured: `implement Bag<T>` 2 errors,
      # `implement Bag<Wq>` 0, the files identical but for the letter.
      #
      # A unit test was tried twice and could not reach it: a bare
      # TypeChecker has no `List`, and with a hand-rolled container the
      # bound parameter is a fresh type variable that unifies with
      # anything. The first attempt asserted an ABSENCE and passed on
      # broken code.
      - name: Type-parameter name does not change the verdict
        run: |
          scripts/ci/check_type_parameter_letter_is_irrelevant.sh --selftest ./target/release/verum
          scripts/ci/check_type_parameter_letter_is_irrelevant.sh ./target/release/verum

      # T0741, fourth on the same axis: one file, one verdict — and here
      # across WHERE a generic sits in the callee's signature. A scheme
      # built from the archive spells a generic by source name inside a
      # parameter's type arguments and by positional placeholder in the
      # return; the bridge that ties the two spellings to one variable
      # lives in env.rs and was missing from its twin in modules.rs.
      # Measured: `mul(y, y)` (T only inside `&DynTensor<T>`) 2 errors,
      # `mul_scalar(y, 2.0)` (T also bare) 0 — the second worked only
      # because one of its parameters happened to carry the return's
      # spelling.
      #
      # Agreement between the two is not sufficient on its own: two
      # broken subjects agree too, so the gate also requires the verdict
      # to be clean.
      - name: Generic's position in a signature does not change the verdict
        run: |
          scripts/ci/check_generic_position_does_not_decide_inference.sh --selftest ./target/release/verum
          scripts/ci/check_generic_position_does_not_decide_inference.sh ./target/release/verum

      - name: AOT smoke under STRICT gates
        continue-on-error: true
        env:
          VERUM_STRICT_MONO: "1"
          VERUM_STRICT_SIGNATURES: "1"
          VERUM_NO_OBJECT_CACHE: "1"
        run: |
          cat > /tmp/strict_smoke.vr <<'EOF'
          fn main() {
              let xs: List<Int> = [3, 1, 2];
              let total = xs.iter().fold(0, fn(acc: Int, x: Int) -> Int { acc + x });
              let m: Maybe<Text> = Maybe.Some(f"total={total}");
              match m {
                  Maybe.Some(s) => print(s),
                  Maybe.None => print("none"),
              }
          }
          EOF
          ./target/release/verum build /tmp/strict_smoke.vr

  # ---------------------------------------------------------------------------
  # Job 4: Lint + format. Both rustfmt and clippy run advisory (visible in UI,
  # non-blocking) until Phase 3 of the production-readiness push lands the
  # one-shot reformat and eliminates the warning backlog. At that point remove
  # `continue-on-error` on both steps.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: rustfmt --check (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: clippy (-D warnings, advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # Job 5: Architectural invariants (#80) — codify the no-libc and
  # target-triple discipline established under #91 perf roadmap so future
  # commits can't silently regress.
  # ---------------------------------------------------------------------------
  arch-guards:
    name: Architectural invariants (no-libc, no-host-cfg)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16 (macOS only)
        if: runner.os == 'macOS'
        # The bundled z3-src C++ build fails under the macos-14 image's
        # default Xcode 15 clang ('no matching constructor for
        # initialization of key_data' in obj_hashtable.h); clang 16+
        # compiles the same source cleanly (verified on a local
        # Darwin 25 toolchain). Pick the newest Xcode 16 on the image.
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          clang++ --version

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arch-guards-${{ matrix.os }}

      - name: Build verum CLI for smoke binary
        run: cargo build --bin verum --locked

      # **No-host-#[cfg(target_os)] in codegen** (#80).
      # Codegen MUST read module.get_triple() — never host-cfg.
      # The script enforces this; new violations block merge.
      - name: Check no host-#[cfg(target_os)] in codegen
        run: python3 scripts/ci/check_no_host_cfg.py --strict

      # **Panic-surface ratchet** (T0424).
      # New IR-emitting code must use the fallible idiom
      # (`.or_llvm_err()?`), not `.unwrap()`/`.expect()` — any NET
      # INCREASE over the committed baseline blocks merge; the T0131
      # sweeps re-rot without this gate.
      - name: Check codegen panic-surface ratchet
        run: python3 scripts/ci/check_panic_surface_ratchet.py

      # **Dup-emitter + dead-libc-body census** (T0438).
      # One definer per verum_* symbol (a losing emitter leaves no IR
      # trace, so only a source census sees both), and no emitter body
      # referencing a forbidden-on-Linux libc extern without a
      # target_is_linux syscall path (the T0436 landmine class).
      - name: Check dup emitters and dead libc bodies
        run: python3 scripts/ci/check_dup_emitters.py

      # **No-libc dynamic linkage** (#80).
      # Builds a smoke .vr program and verifies the produced binary
      # only links the platform's permitted system boundary
      # (libSystem.B.dylib on macOS; ld-linux on Linux; nothing else).
      - name: Assert the LLVM tools this job needs are present
        # The smoke build shells out to llc / opt / llvm-link (Phase 7.5).
        # When the fetched prebuilt lacks them the compiler silently falls
        # back to the host's `opt-18`, mixes LLVM versions, and dies at
        # `llc` — reported as a no-libc failure, which is not what broke.
        # Measured on CI run 32164849233: the linux-x86_64 prebuilt ships
        # llvm-config, lld and wasm-ld but NOT llc, opt or llvm-link.
        run: |
          set -euo pipefail
          missing=""
          for tool in llc opt llvm-link; do
            [[ -f "llvm/install/bin/${tool}" ]] || missing="${missing} ${tool}"
          done
          if [[ -n "${missing}" ]]; then
            echo "::error::the prebuilt LLVM for this runner lacks:${missing} — this job cannot build an AOT binary. Fix the prebuilt (build-llvm.yml) rather than this job."
            exit 1
          fi

      - name: Check AOT binary doesn't link libc
        # tee + failure artifact: this step failed on ubuntu with its
        # log blob vanished on every run since the tests-gate went
        # live; the artifact is the surviving diagnostic channel.
        run: ./scripts/ci/check_no_libc_link.sh target/debug/verum 2>&1 | tee no-libc-smoke.log; exit ${PIPESTATUS[0]}

      - name: Upload no-libc smoke log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: no-libc-smoke-log-${{ matrix.os }}
          path: no-libc-smoke.log
          retention-days: 3
