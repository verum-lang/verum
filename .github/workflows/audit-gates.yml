name: Audit gates

# Runs the kernel-soundness band of `verum audit` on every push to main
# and every PR.  Three job tiers:
#
#   1. In-process gates (cheap, no external tools — runs on every push):
#      --differential-kernel, --differential-kernel-fuzz, --kernel-soundness,
#      --kernel-rules, --kernel-recheck.
#
#   2. Cross-language gate with Lean 4 toolchain (medium cost — runs on
#      every push but caches Lake build artefacts):
#      --differential-lean-checker.
#
#   3. Tri-prover replay across Lean / Coq / Isabelle (expensive — runs
#      on push to main only, caches heap files):
#      --external-prover-replay.
#
# The drift guard added in PR-1 fires inside `--kernel-soundness` and
# is the architectural backstop for status drift between mod.rs and the
# Lean / Coq / Isabelle exports.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Tier 1: in-process audit gates.  No external toolchain needed.
  # ---------------------------------------------------------------------------
  in-process-gates:
    name: In-process audit gates
    runs-on: ubuntu-latest
    # The verum CLI release build alone measures ~65 min on this
    # runner (see the replay job's timings); a 30-minute budget could
    # NEVER fit it, so this job has timeout-cancelled on every run
    # since it landed — reading as a cascade-cancel, never as itself.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-audit-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-audit-${{ runner.os }}-

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Build verum CLI
        run: cargo build --release --bin verum

      - name: kernel-soundness (drift guard + cross-export emit)
        run: |
          cd core
          ../target/release/verum audit --kernel-soundness

      - name: kernel-rules + kernel-recheck
        run: |
          cd core
          ../target/release/verum audit --kernel-rules
          ../target/release/verum audit --kernel-recheck

      - name: differential-kernel (3-way agreement on canonical battery)
        run: |
          cd core
          ../target/release/verum audit --differential-kernel

      - name: differential-kernel-fuzz (500-iter property fuzz)
        run: |
          cd core
          ../target/release/verum audit --differential-kernel-fuzz

      # The silent-acceptance ratchet needs a built binary, which this job
      # already has. It was a Makefile target with no CI caller — the gate
      # existed and nobody asked it, which is the exact class it was
      # written to catch (T1025/T1026/T1027/T0989).
      #
      # It carries its own positive control and a MUTE outcome: a run that
      # printed nothing fails rather than passing, because a tool that
      # cannot speak is otherwise indistinguishable from a clean tree.
      - name: silent-acceptance ratchet
        run: make check-silent-acceptance VERUM=target/release/verum

      - name: Typed finite program preservation and proof rejection
        run: |
          python3 verification/external/lean/check_typed_programs.py \
            --report typed-programs-acceptance.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: in-process-audit-reports
          path: core/target/audit-reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tier 2: cross-language differential — Rust kernel ↔ Lean ReferenceChecker.
  # Caches Lake build artefacts so re-runs are fast after the first build.
  # ---------------------------------------------------------------------------
  differential-lean:
    name: Differential Lean checker
    runs-on: ubuntu-latest
    # Same impossible budget as in-process-gates: the build step alone
    # exceeds 30 minutes on this runner.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4 (elan)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat verification/external/lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-audit-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-audit-${{ runner.os }}-

      # The .lake cache is keyed on the Lean SOURCES, separately from
      # cargo: bundled together and keyed only on Cargo.lock+lakefile,
      # a .lake built in the era when ReferenceChecker.lean did not
      # compile kept being restored, and lake failed the build against
      # stale artefacts while the same command built clean from scratch
      # (measured on 0cfff93ee — local green, CI "build failed"). No
      # restore-keys: a source change means a cold, honest lake build.
      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: verification/external/lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('verification/external/lean/lean-toolchain', 'verification/external/lean/lakefile.toml', 'verification/external/lean/**/*.lean') }}

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Build verum CLI
        run: cargo build --release --bin verum

      - name: differential-lean-checker (24-cert battery, Rust ↔ Lean unanimity)
        run: |
          cd core
          ../target/release/verum audit --differential-lean-checker

      - name: Reference term laws and native certificate replay
        run: |
          (cd verification/external/lean && lake build \
            verum_replay_checker \
            VerumExternalReplay.ReductionSemantics \
            VerumExternalReplay.DiagnosticFactorization \
            VerumExternalReplay.ExactTransports \
            VerumExternalReplay.TypedPrograms)
          VERUM_LEAN_REPLAY="$GITHUB_WORKSPACE/verification/external/lean/.lake/build/bin/verum_replay_checker" \
            cargo test --locked -p verum_proof --test lean_replay --test induction_lean_replay --test universe_lean_replay --test dependent_pairs --test admission -- --include-ignored

      - name: General finite execution and observation certificates
        run: |
          cargo build --locked --release -p verum_proof --features process --bin verum-proof
          python3 verification/certificates/check_conservative_refinement.py \
            --native target/release/verum-proof \
            --lean verification/external/lean/.lake/build/bin/verum_replay_checker \
            --report conservative-refinement-acceptance.json

      - name: Dependent constructor source and certificate replay
        run: |
          python3 verification/certificates/check_dependent_constructors.py \
            --native target/release/verum-proof \
            --lean verification/external/lean/.lake/build/bin/verum_replay_checker \
            --report dependent-constructors-acceptance.json

      - name: Native typed-program macro preservation replay
        run: |
          python3 verification/certificates/check_typed_programs.py \
            --native target/release/verum-proof \
            --lean verification/external/lean/.lake/build/bin/verum_replay_checker \
            --report native-typed-programs-acceptance.json
      - name: Native typed observer folds and exact partial domains
        run: |
          python3 verification/certificates/check_partial_observers.py \
            --native target/release/verum-proof \
            --lean verification/external/lean/.lake/build/bin/verum_replay_checker \
            --report native-partial-observers-acceptance.json
          python3 verification/external/lean/check_partial_observers.py \
            --report partial-observers-acceptance.json
          python3 verification/external/lean/check_finite_code.py \
            --report finite-code-acceptance.json
          python3 verification/external/lean/check_finite_execution.py \
            --report finite-execution-acceptance.json
          python3 verification/external/lean/check_observer_lifecycle.py \
            --report observer-lifecycle-acceptance.json
          python3 verification/external/lean/check_common_description_cost.py \
            --report common-description-cost-acceptance.json
          python3 verification/external/lean/check_observer_retirement.py \
            --report observer-retirement-acceptance.json
          python3 verification/external/lean/check_enumerable_mass.py \
            --report enumerable-mass-acceptance.json
          python3 verification/external/lean/check_categorical_prediction.py \
            --report categorical-prediction-acceptance.json
          python3 -m unittest discover -s verification/external/lean -p test_causal_coding.py
          python3 -m unittest discover -s verification/external/lean -p test_finite_wire.py
          python3 -m unittest discover -s verification/external/lean -p test_binary_prediction.py
          python3 -m unittest discover -s verification/external/lean -p test_residual_prediction.py
          python3 verification/external/lean/check_finite_admission.py \
            --report finite-admission-acceptance.json
          python3 verification/external/lean/check_acquisition_scheduling.py \
            --report acquisition-scheduling-acceptance.json
      - name: Frozen observer export correspondence
        run: |
          python3 verification/external/lean/check_residual_export.py \
            --export verification/external/lean/fixtures/residual-native-v1.json \
            --sha256 87a25e61eb67968695e3c0988417824bdfce1877aeea8ce5e30a0c2350fedde6 \
            --provenance verification/external/lean/fixtures/residual-native-v1.provenance.json \
            --output residual-native-export.lean --report residual-native-export-acceptance.json
          python3 verification/external/lean/check_observer_export.py \
            --export verification/external/lean/fixtures/observer-runtime-controls-v1.json \
            --sha256 9925524cd22fbae2cbbb6f32fb522a90b3ea6c0c6c5f86c428ada980052898a6 \
            --provenance verification/external/lean/fixtures/observer-runtime-controls-v1.provenance.json \
            --output observer-export.lean --report observer-export-acceptance.json
          python3 -m unittest discover -s verification/external/lean -p test_observer_export.py
          python3 -m unittest discover -s verification/external/lean -p test_physical_read_export.py
          python3 -m unittest discover -s verification/external/lean -p test_retirement_export.py
          gzip -dc verification/external/lean/fixtures/observer-retirement-v1.json.gz > observer-retirement.json
          python3 verification/external/lean/check_retirement_export.py \
            --export observer-retirement.json \
            --sha256 bc7c8f9253365b4a9c97cd12f73af730192c29ed6560f6238145fc61f46ddf67 \
            --provenance verification/external/lean/fixtures/observer-retirement-v1.provenance.json \
            --output observer-retirement-export.lean --report observer-retirement-export-acceptance.json
          python3 -m unittest discover -s verification/external/lean -p test_lifecycle_export.py
          python3 -m unittest discover -s verification/external/lean -p test_retained_names.py
          python3 -m unittest discover -s verification/external/lean -p test_retained_execution.py
          python3 -m unittest discover -s verification/external/lean -p test_retained_execution_snapshot.py
          python3 -m unittest discover -s verification/external/lean -p test_retained_execution_export.py
          gzip -dc verification/external/lean/fixtures/shared-vm-native-v1.json.gz > shared-vm-native-v1.json
          python3 verification/external/lean/check_retained_execution_export.py \
            --export shared-vm-native-v1.json \
            --sha256 dea7339bde7e9846e7ece4402281f69ee30609dc1a41a3c3a8ae2d43bfc52d6b \
            --provenance verification/external/lean/fixtures/shared-vm-native-v1.provenance.json \
            --output shared-vm-native-export.lean --report shared-vm-native-export-acceptance.json
          python3 -m unittest discover -s verification/external/lean -p test_retained_invocation_export.py
          gzip -dc verification/external/lean/fixtures/shared-invocation-native-v1.json.gz > shared-invocation-native-v1.json
          python3 verification/external/lean/check_retained_invocation_export.py \
            --export shared-invocation-native-v1.json \
            --sha256 d49b308ef399adf57ad61cd0a955c8ca50b8689789ed193431e3c6424a2dba1e \
            --provenance verification/external/lean/fixtures/shared-invocation-native-v1.provenance.json \
            --output shared-invocation-native-export.lean --report shared-invocation-native-export-acceptance.json
          python3 -m unittest discover -s verification/external/lean -p test_retained_names_export.py
          gzip -dc verification/external/lean/fixtures/retained-names-v1.json.gz > retained-names-v1.json
          python3 verification/external/lean/check_retained_names_export.py \
            --export retained-names-v1.json \
            --sha256 8ce302562db6409ebe259669fb9d5663985f3fea2ad812cb21080ded0f5387e5 \
            --provenance verification/external/lean/fixtures/retained-names-v2.provenance.json \
            --output retained-names-export.lean --report retained-names-export-acceptance.json
          gzip -dc verification/external/lean/fixtures/observer-lifecycle-v5.json.gz > observer-lifecycle-v5.json
          python3 verification/external/lean/check_lifecycle_export.py \
            --export observer-lifecycle-v5.json \
            --sha256 9721898c7bf72678dfdf0ea2182d9cdef99dacfcae1308c8bf6a41b651aa4900 \
            --provenance verification/external/lean/fixtures/observer-lifecycle-v5.provenance.json \
            --output observer-lifecycle-v5-export.lean --report observer-lifecycle-v5-export-acceptance.json
          python3 -m unittest discover -s verification/external/lean -p test_joint_export.py
          python3 -m unittest discover -s verification/external/lean -p test_structural_export.py
          python3 -m unittest discover -s verification/external/lean -p test_refinement_feasibility.py
          python3 -m unittest discover -s verification/external/lean -p test_capacity_products.py
          python3 -m unittest discover -s verification/external/lean -p test_refinement_capacity.py
          python3 -m unittest discover -s verification/external/lean -p test_categorical_score.py
          python3 -m unittest discover -s verification/external/lean -p test_retained_transfer_codec.py
          python3 -m unittest discover -s verification/external/lean -p test_transfer_export.py
          python3 -m unittest discover -s verification/external/lean -p test_transfer_publication.py
          gzip -dc verification/external/lean/fixtures/recipient-transfer-v3-0.json.gz > recipient-transfer-0.json
          python3 verification/external/lean/check_transfer_export.py \
            --export recipient-transfer-0.json \
            --sha256 a024e586e000b038430a4fead05727e8825c6df511ac640ca3cf76b3045218a6 \
            --provenance verification/external/lean/fixtures/recipient-transfer-v3-0.provenance.json \
            --output recipient-transfer-0.lean --report recipient-transfer-0-acceptance.json
          gzip -dc verification/external/lean/fixtures/recipient-transfer-v3-3.json.gz > recipient-transfer-3.json
          python3 verification/external/lean/check_transfer_export.py \
            --export recipient-transfer-3.json \
            --sha256 87dbc14f34aaac522af75db730ba39a9c69fccd6593cd2ccf7b15e896a21374e \
            --provenance verification/external/lean/fixtures/recipient-transfer-v3-3.provenance.json \
            --output recipient-transfer-3.lean --report recipient-transfer-3-acceptance.json
          gzip -dc verification/external/lean/fixtures/recipient-transfer-v4-0.json.gz > recipient-transfer-v4-0.json
          python3 verification/external/lean/check_transfer_export.py \
            --export recipient-transfer-v4-0.json \
            --sha256 f602831924ee15752796fe3d762a7544e63634173c85cbd2d3339707cc0d7f60 \
            --provenance verification/external/lean/fixtures/recipient-transfer-v4-0.provenance.json \
            --output recipient-transfer-v4-0.lean --report recipient-transfer-v4-0-acceptance.json
          gzip -dc verification/external/lean/fixtures/recipient-transfer-v4-3.json.gz > recipient-transfer-v4-3.json
          python3 verification/external/lean/check_transfer_export.py \
            --export recipient-transfer-v4-3.json \
            --sha256 5a498f54aab8392c68da7c56cfbd7357088d857554b3dde093792378de54edfc \
            --provenance verification/external/lean/fixtures/recipient-transfer-v4-3.provenance.json \
            --output recipient-transfer-v4-3.lean --report recipient-transfer-v4-3-acceptance.json
          python3 verification/external/lean/check_lifecycle_export.py \
            --export verification/external/lean/fixtures/observer-lifecycle-v1.json \
            --sha256 d81cc445752ee9e95a59fbd8915d02802211a810d6ce182b80025ab482260199 \
            --provenance verification/external/lean/fixtures/observer-lifecycle-v1.provenance.json \
            --output observer-lifecycle-export.lean --report observer-lifecycle-export-acceptance.json
          python3 verification/external/lean/check_lifecycle_export.py \
            --export verification/external/lean/fixtures/observer-lifecycle-v2.json \
            --sha256 2f4715560e732e75fc664ac9d405445654aca07c5f18cf1e87ca4c316d448829 \
            --provenance verification/external/lean/fixtures/observer-lifecycle-v2.provenance.json \
            --output observer-lifecycle-v2-export.lean --report observer-lifecycle-v2-export-acceptance.json
          python3 verification/external/lean/check_joint_export.py \
            --export verification/external/lean/fixtures/observer-joint-v1.json \
            --sha256 0b361f8c7ab1fdf7405fc29a8170fbe14740a224adf7a6fcc98e40531054b58e \
            --provenance verification/external/lean/fixtures/observer-joint-v1.provenance.json \
            --output observer-joint-export.lean --report observer-joint-export-acceptance.json
          gzip -dc verification/external/lean/fixtures/observer-joint-v2.json.gz > observer-joint-v2.json
          python3 verification/external/lean/check_joint_export.py \
            --export observer-joint-v2.json \
            --sha256 ea2ca04dde2d4f83a7ac75c03dd992d0490b33dedec7baa85c668b9b4a56f710 \
            --provenance verification/external/lean/fixtures/observer-joint-v2.provenance.json \
            --output observer-joint-v2.lean --report observer-joint-v2-acceptance.json
          gzip -dc verification/external/lean/fixtures/observer-joint-v3.json.gz > observer-joint-v3.json
          python3 verification/external/lean/check_joint_export.py \
            --export observer-joint-v3.json \
            --sha256 3a956d81dcdb004bfee0d43652f95cc12881e54a5e31c184a2ef312b5074c106 \
            --provenance verification/external/lean/fixtures/observer-joint-v3.provenance.json \
            --output observer-joint-v3.lean --report observer-joint-v3-acceptance.json

      - name: Frozen physical observer reads and commits
        run: |
          gzip -dc verification/external/lean/fixtures/observer-lifecycle-v3.json.gz > observer-lifecycle-v3.json
          python3 verification/external/lean/check_lifecycle_export.py \
            --export observer-lifecycle-v3.json \
            --sha256 acef1434f816eb0bf539fe3f6228c1c30fd649b313df7bb6a185186a298d1b05 \
            --provenance verification/external/lean/fixtures/observer-lifecycle-v3.provenance.json \
            --output observer-lifecycle-v3.lean --report observer-lifecycle-v3-acceptance.json
          gzip -dc verification/external/lean/fixtures/observer-physical-successors-v2.json.gz > observer-physical-successors.json
          python3 verification/external/lean/check_physical_read_export.py \
            --export observer-physical-successors.json \
            --sha256 733968a3921c4d43636b4521f570c5db3dd52dbfad06f8774fa7f7154d43eaa5 \
            --provenance verification/external/lean/fixtures/observer-physical-successors-v2.provenance.json \
            --output observer-physical-successors.lean --report observer-physical-successors-acceptance.json
          gzip -dc verification/external/lean/fixtures/observer-physical-terminal-v2.json.gz > observer-physical-terminal.json
          python3 verification/external/lean/check_physical_read_export.py \
            --export observer-physical-terminal.json \
            --sha256 44a2447c5e43c6948d80577e4c789b433b2a705cb78f0b550148ab7f4c0607cf \
            --provenance verification/external/lean/fixtures/observer-physical-terminal-v2.provenance.json \
            --output observer-physical-terminal.lean --report observer-physical-terminal-acceptance.json

      - name: Indexed family source and certificate replay
        run: |
          python3 verification/certificates/check_indexed_induction.py \
            --native target/release/verum-proof \
            --lean verification/external/lean/.lake/build/bin/verum_replay_checker \
            --report indexed-induction-acceptance.json

      - name: Owned dispatch and observation-envelope contracts
        run: |
          python3 verification/certificates/check_dispatch_contract.py \
            --native target/release/verum-proof \
            --lean verification/external/lean/.lake/build/bin/verum_replay_checker \
            --report owned-dispatch-acceptance.json

      - name: Candidate-support locality contracts
        run: |
          python3 verification/certificates/check_candidate_locality.py \
            --native target/release/verum-proof \
            --lean verification/external/lean/.lake/build/bin/verum_replay_checker \
            --report candidate-locality-acceptance.json

      - name: Diagnostic-fibre nonfactorization contracts
        run: |
          python3 verification/certificates/check_diagnostic_fibres.py \
            --native target/release/verum-proof \
            --lean verification/external/lean/.lake/build/bin/verum_replay_checker \
            --report diagnostic-fibres-acceptance.json

      - name: Exact partial-execution transport composition
        run: |
          python3 verification/certificates/check_exact_transports.py \
            --native target/release/verum-proof \
            --lean verification/external/lean/.lake/build/bin/verum_replay_checker \
            --report exact-transports-acceptance.json

      - name: Typed finite program preservation and proof rejection
        run: |
          python3 verification/external/lean/check_typed_programs.py \
            --report typed-programs-acceptance.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-lean-audit-reports
          path: |
            core/target/audit-reports/
            conservative-refinement-acceptance.json
            owned-dispatch-acceptance.json
            candidate-locality-acceptance.json
            diagnostic-fibres-acceptance.json
            exact-transports-acceptance.json
            typed-programs-acceptance.json
            dependent-constructors-acceptance.json
            indexed-induction-acceptance.json
            native-typed-programs-acceptance.json
            native-partial-observers-acceptance.json
            partial-observers-acceptance.json
            finite-code-acceptance.json
            finite-execution-acceptance.json
            observer-lifecycle-acceptance.json
            observer-retirement-acceptance.json
            observer-retirement-export*
            enumerable-mass-acceptance.json
            categorical-prediction-acceptance.json
            finite-admission-acceptance.json
            acquisition-scheduling-acceptance.json
            observer-export-acceptance.json
            observer-joint-export-acceptance.json
            observer-joint-export.lean
            observer-joint-export-*/
            observer-joint-v2*
            observer-joint-v3*
            observer-physical-*-acceptance.json
            observer-physical-*.lean
            observer-physical-*-*/
            observer-lifecycle-v3-acceptance.json
            observer-lifecycle-v3.lean
            observer-lifecycle-v3-*/
            observer-lifecycle-v5-export-acceptance.json
            shared-vm-native-export-acceptance.json
            shared-vm-native-export.lean
            shared-vm-native-export-*/
            shared-invocation-native-export-acceptance.json
            shared-invocation-native-export.lean
            shared-invocation-native-export-*/
            observer-lifecycle-v5-export.lean
            observer-lifecycle-v5-export-*/
            retained-names-export-acceptance.json
            recipient-transfer-*-acceptance.json
            recipient-transfer-*.lean
            recipient-transfer-0-*/
            recipient-transfer-3-*/
            recipient-transfer-v4-*/
            retained-names-export.lean
            retained-names-export-*/
            observer-export*.lean
            observer-export-*/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tier 3: tri-prover replay — Lean / Coq / Isabelle.  Heaviest gate;
  # runs on push to main only.  Caches Isabelle heap files (the slowest
  # part — 8-12 minute first build, ~30-second incremental).
  # ---------------------------------------------------------------------------
  external-prover-replay:
    name: External-prover replay (Lean / Coq / Isabelle)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat verification/external/lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Coq / Rocq
        run: |
          sudo apt-get update
          # `coqc` (the binary the replay invokes — verum_smt cross_format_runner)
          # ships in `coq`; the `rocq-prover` apt package does not exist on
          # Ubuntu 24.04, so installing it hard-failed the step with E100.
          sudo apt-get install -y coq

      - name: Cache Isabelle distribution + HOL heap
        id: cache-isabelle
        uses: actions/cache@v4
        with:
          path: |
            /opt/Isabelle2025-2
            ~/.isabelle
          key: isabelle-2025-2-hol-${{ runner.os }}-${{ hashFiles('verification/external/isabelle/ROOT', 'verification/external/isabelle/KernelSoundness.thy') }}
          restore-keys: isabelle-2025-2-hol-${{ runner.os }}-

      - name: Install Isabelle 2025-2
        if: steps.cache-isabelle.outputs.cache-hit != 'true'
        id: install-isabelle
        # The TUM mirror flakes (measured: 133s connect timeout hard-failed
        # the whole audit run). Retry hard, then fall back to the SourceForge
        # mirror; if BOTH are down, mark the Isabelle leg skipped — Lean and
        # Coq still replay and gate. A red caused by a mirror outage teaches
        # nothing; the skip is LOUD (step outcome + replay summary).
        continue-on-error: false
        run: |
          fetch() { curl -fSL --retry 5 --retry-all-errors --connect-timeout 30 "$1"; }
          if fetch https://isabelle.in.tum.de/dist/Isabelle2025-2_linux.tar.gz | sudo tar xz -C /opt \
            || fetch https://downloads.sourceforge.net/project/isabelle/Isabelle2025-2_linux.tar.gz | sudo tar xz -C /opt; then
            /opt/Isabelle2025-2/bin/isabelle build -b HOL
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Isabelle mirrors unreachable — Isabelle replay SKIPPED this run (Lean/Coq still gate)"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Isabelle to PATH
        if: steps.cache-isabelle.outputs.cache-hit == 'true' || steps.install-isabelle.outputs.available == 'true'
        run: echo "/opt/Isabelle2025-2/bin" >> $GITHUB_PATH

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-audit-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-audit-${{ runner.os }}-

      # The .lake cache is keyed on the Lean SOURCES, separately from
      # cargo: bundled together and keyed only on Cargo.lock+lakefile,
      # a .lake built in the era when ReferenceChecker.lean did not
      # compile kept being restored, and lake failed the build against
      # stale artefacts while the same command built clean from scratch
      # (measured on 0cfff93ee — local green, CI "build failed"). No
      # restore-keys: a source change means a cold, honest lake build.
      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: verification/external/lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('verification/external/lean/lean-toolchain', 'verification/external/lean/lakefile.toml', 'verification/external/lean/**/*.lean') }}

      - name: Fetch prebuilt LLVM
        uses: ./.github/actions/fetch-llvm

      - name: Build verum CLI
        run: cargo build --release --bin verum

      - name: external-prover-replay (tri-prover, --strict)
        run: |
          cd core
          # --strict makes an UNAVAILABLE backend fatal. That is right
          # when the runner has all three provers, and exactly wrong
          # when the Isabelle mirrors are down — the install step above
          # deliberately degrades to "skipped, loudly" in that case,
          # and a red caused by a mirror outage teaches nothing. So:
          # strict when Isabelle is reachable, loud degradation when
          # not; Lean + Coq hard errors stay fatal either way.
          if command -v isabelle >/dev/null 2>&1; then
            STRICT=--strict
          else
            STRICT=""
            echo "::warning::Isabelle unavailable on this runner — replay runs without --strict (Lean + Coq still gate hard errors)"
          fi
          ../target/release/verum audit --external-prover-replay $STRICT

      - name: Typed finite program preservation and proof rejection
        run: |
          python3 verification/external/lean/check_typed_programs.py \
            --report typed-programs-acceptance.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-prover-audit-reports
          path: core/target/audit-reports/
          retention-days: 30
