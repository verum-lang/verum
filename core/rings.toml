# =============================================================================
# core/rings.toml — the standard library's layering law, as data
# =============================================================================
#
# THE LAW (docs/architecture/core-reference-architecture.md §4):
#
#     A module in ring N depends only on rings < N.
#     Edges upward and sideways between rings do not exist.
#
# Ring 0 is declared as ONE cohesive unit — the language's primitive
# layer. Mutual dependencies INSIDE ring 0 are expected and correct
# (§6bis.2a: `Maybe.ok_or -> Result` and `Result.ok -> Maybe` are paired
# conversions; severing them would be a defect, not an improvement).
# Only edges BETWEEN rings are constrained.
#
# Enforced by `scripts/ci/check_core_rings.py` (gate: `make check-rings`).
# A module absent from this file is itself a violation: an unplaced
# module is one whose layer nobody decided.
#
# Placement follows the MEASURED dependency graph, not intent. When a
# module cannot be placed without creating an upward edge, the correct
# response is to move the dependency down — never to widen a ring.
# =============================================================================

[ring.0]
name = "primitive"
# ONE cohesive layer, not a set of separable modules — see the header.
# Declared as data so the gate enforces the same sentence the prose
# states; without it, clause (b) reported `base <-> intrinsics` and
# `base <-> collections.list` as violations of a rule this file had
# already exempted them from.
cohesive = true
# The language's own vocabulary: what the grammar, the checker and
# `@derive` name. This is also exactly what the prelude publishes
# (core/mod.vr) — the prelude IS ring 0's surface, never a directory glob.
#
# `intrinsics` belongs here and not below: §6bis.2 measured the
# base ↔ intrinsics cycle and concluded the two are ONE cohesive layer
# (Maybe/Result are needed by intrinsics; intrinsics are needed by base).
# `types` likewise names the checker's own vocabulary.
modules = [
    "base", "types", "intrinsics",
    # The LANGUAGE's own vocabulary. CLAUDE.md mandates List/Text/Map/Set
    # as the semantic types — they are named by the grammar and by every
    # signature in the stdlib, exactly like Maybe and Result, and they
    # belong in the primitive layer for the same reason.
    #
    # The measurement forces it too: `base` uses List/Map/Text in 384
    # places across its own files, and `collections/list.vr` depends on
    # `base` (coercion, memory, ordering). That is a genuine MUTUAL
    # dependency — the same shape as the base <-> intrinsics pair this
    # ring already declares as one cohesive layer. Their own mounts
    # confirm the placement: list/map/set/text.text reach only `core.*`,
    # `core.base.*` and `core.intrinsics.*`.
    #
    # `collections` and `text` as WHOLES stay at ring 2: btree, deque,
    # lru, bloom, the regex engine and the formatter are not vocabulary.
    #
    # Consequence, and the reason base/ and types/ now mount the
    # DEFINING module rather than the umbrella re-export: ring 0 cannot
    # use the convenience of `mount collections.List`, because naming
    # the umbrella makes the edge point at ring 2. Higher rings may keep
    # using it — for them the edge is lateral. This also removes the
    # one-hop indirection through a re-export, which hides which module
    # a dependency actually comes from.
    "collections.list", "collections.map", "collections.set", "text.text",
]

# =============================================================================
# DECLARED EXCEPTIONS
# =============================================================================
#
# An edge listed here violates the ring law and is allowed to, with the
# reason written down.  This exists because the alternative is worse: a
# gate that cannot express "known, and here is why" gets switched off, and
# a law nobody runs is not a law.
#
# The bar is deliberately high — an entry is a claim that moving the
# dependency down is not merely inconvenient but wrong, and it must name
# what would have to change for the entry to go away.  Adding one is a
# decision, and its diff is where that decision gets reviewed.
[exceptions]
"base.memory -> mem" = """
`core/base/memory.vr` is the CBGR reference model — validity, generations,
capability bits — and it calls the allocator: `cbgr_alloc`,
`cbgr_dealloc`, `get_header_from_ptr`, plus `AllocationHeader` and
`HEADER_SIZE` for the pointer-to-header offset (imported precisely so the
`- 32` that used to be hardcoded at seven sites cannot drift).

`mem` is ring 1 because `mem/allocator.vr` mounts `sys.linux.mem.{mmap,
munmap, mprotect}`, `sys.darwin.libsystem` and `sys.windows.kernel32`.  An
allocator cannot avoid the syscall layer, so moving `mem` down would drag
mmap into the foundation — which is the widening the law forbids.

This edge was INVISIBLE until 2026-08-15: it is written `mount
super.super.mem.allocator.{…}`, and the gate returned nothing for every
`super.`-rooted mount on the assumption that relative always means
intra-module.  Measured, 15 of 581 relative mounts leave their module and
this is the only one that leaves it upward.

WHAT WOULD RETIRE THIS ENTRY: `mem/header.vr` needs no syscalls — it
mounts only intrinsics and siblings — so the `AllocationHeader` /
`HEADER_SIZE` half is a cut-by-guarantee away from ring 0, the same cut
`context.random` and `security/hash` got.  The allocator half is the real
question: either ring 0's memory model reaches the CBGR intrinsics
directly rather than the ring-1 wrapper (blocked today by T0463 —
`cbgr_dealloc`/`cbgr_realloc` carry no `@intrinsic` attribute), or
`base/memory.vr` is itself split into the pure reference model and the
allocating half.
"""

[ring."0.5"]
name = "contract"
# Dependency-free CONTRACTS: a `context` declaration that names only
# foundation types, with no implementation and therefore no platform,
# no time and no I/O.
#
# This layer exists because `core/context/standard.vr` was named by
# TOPIC and its ring was set by its heaviest member: `Clock` needs
# Duration/Instant/SystemTime and `FileSystem` needs Read/Write, so all
# fifteen declarations sat at ring 3 — including `Random`, which needs
# `Int`, `Float`, `Bool` and `List<Byte>` and nothing else.
#
# `core/math/{simple,nn,tensor}.vr` declare `using [Random]`, and math is
# ring 2.  That edge was invisible for as long as the prelude published
# `context.standard` into every file without a `mount`; making the
# dependency explicit made it an honest ring-2 -> ring-3 violation, and
# the law's answer to a violation is to move the dependency DOWN.
#
# Same doctrine as §4quinquies (`security/hash`): cut by GUARANTEE, not
# by topic.  A contract guarantees nothing about the world, so it cannot
# owe anything to it.
modules = [
    "context.random",
]

[ring.1]
name = "platform"
# ONE cohesive layer, for the same reason ring 0 is: its members are
# mutually dependent BY NATURE, and severing an edge would mean
# duplicating one side rather than improving anything.
#
# Measured pairs: `sync.atomic` mounts `sys.{linux,darwin,windows}.thread`
# for futex wait/wake — an atomic that blocks IS a syscall — while
# `sys/windows/winsock2.vr` needs an `AtomicInt` to guard WSA
# initialisation. Likewise `intrinsics.lowlevel` reads `sys.linux.auxv`
# to detect CPU features, and `sys` is written in those intrinsics.
#
# Cohesion is declared, not assumed: the test is whether cutting the
# edge would be an improvement. Here it would not — a futex-backed
# atomic cannot avoid the syscall layer, and the syscall layer cannot
# initialise itself without an atomic.
cohesive = true
# The syscall / hardware boundary. Ring 1 and not ring 2: the CBGR
# allocator (`mem`) calls `mmap`/`mprotect`/`get_tid_fast` directly
# (core/mem/segment.vr:68, core/mem/heap.vr:80) — memory management IS
# a platform service, and placing `mem` above `sys` would invert the
# real, correct direction of that dependency.
modules = [
    "sys", "mem", "target", "sync.atomic", "intrinsics.lowlevel",
    # An IP address is a VALUE, not a networking capability. `net.addr`
    # now mounts nothing but the prelude — hostname RESOLUTION moved to
    # `net.resolve`, which is where the DNS round-trip belongs. Until
    # that split, the address type depended on the resolver, which is
    # why `core/sys/net_ops.vr` naming a `SocketAddr` and
    # `core.security.x509` parsing an IP for SAN matching both had to
    # reach into ring 5.
    "net.addr",
]
# Two submodules placed by measurement rather than by their parent's name:
#
#  * `sync.atomic` mounts only `core.intrinsics.atomic` (ring 0),
#    `core.intrinsics.platform` and `sys.{linux,darwin}.thread` (ring 1).
#    Atomics ARE the platform's memory-ordering surface, not a container
#    algorithm, which is why `sys/windows/winsock2.vr` needs one.
#  * `intrinsics.lowlevel` reads `sys.linux.auxv` to detect CPU features
#    (`lowlevel/aarch64.vr:720`). Asking the kernel what hardware this is
#    is the platform boundary by definition.
#
# Neither move creates a downward-looking parent edge: umbrellas declare
# children with `public module X;`, which is a declaration, not a mount.
# That is NOT universal — `math` re-mounts its own `frameworks` subtree
# with ABSOLUTE paths from sibling files (math/meta_cls.vr:37,
# math/syn_mod.vr:82), so raising those submodules turned the parent's
# own references into 30+ upward edges. Check for absolute intra-module
# mounts before refining a submodule's ring.

[ring."1.5"]
name = "byte-primitive"
# Computation over bytes, and nothing else: digests, keyed
# authentication, entropy, constant-time operations. Their own headers
# declare "Dependencies: core" and the measurement agrees.
#
# They were `core/security/{hash,mac,util}` until the ring law was
# first enforced, which put `collections`, `encoding` and `storage`
# (ring 2) in the position of depending on ring 5 to obtain a hash.
# The layering was not the only casualty: `core.security.hash.murmur3`
# and `core.security.hash.crc32` announce a security property that
# MurmurHash and CRC-32 explicitly do not have. Grouping by topic
# ("security") rather than by layer produced both defects at once.
#
# Half a ring, not ring 1: these are pure computation and do not touch
# the syscall boundary — except `random.secure`, which is entropy, a
# platform service by nature.
modules = [
    "hash", "mac", "random", "subtle", "security.ecc",
    # HKDF and PBKDF2 are HMAC in a loop: hkdf mounts only `core.*` and
    # `core.mac.hmac`, pbkdf2 adds `collections.list`. Their placement
    # in ring 5 was what made TLS 1.3 — which cannot derive a key
    # schedule without them — appear to depend upward on the security
    # stack, and it is half of the net <-> security cycle.
    # `kdf.argon2` stays in ring 5: it mounts `security.password_hash`.
    "security.kdf.hkdf", "security.kdf.pbkdf2",
    # Block/stream ciphers and the AEADs built on them. Measured
    # mounts: `cipher.{aes,chacha20}` take nothing but the prelude;
    # `aead.aes_gcm` takes `collections.list`, its own cipher and
    # `subtle.constant_time`; `aead.chacha20_poly1305` adds
    # `mac.poly1305`. All of that is ring 1.5 or below — this is
    # arithmetic over bytes, the same as a digest or a curve.
    #
    # Ring 5 put QUIC and TLS, which cannot encrypt a packet without
    # them, in the position of depending sideways into the security
    # stack, which is half of the net <-> security cycle.
    "security.cipher", "security.aead",
]
# `security.ecc` is here by MEASUREMENT, not by topic: ed25519, p256,
# x25519 and mod have ZERO external mounts, bls12_381 and vrf only a
# sibling plus the prelude. Curve arithmetic is byte computation exactly
# like a digest. Its NAME does not lie — Ed25519 IS cryptography — so the
# file stays in `security/` and only the ring is corrected, per the
# doctrine in §4quinquies. This is what lets `cog` (ring 4) sign an
# archive without depending upward.

[ring.2]
name = "data"
# Container and value algorithms. May use the platform (allocation,
# clocks) but nothing above it.
modules = [
    "collections", "text", "encoding", "math", "simd", "logic", "io",
    "time", "sync",
    # `configuration` parses TOML into a value tree and converts it. Its
    # mounts are `base`, `collections` and `time` — nothing above ring 2.
    # Ring 5 was a topical placement ("configuration sounds like an
    # application concern"), and it made `cog`, which reads a package
    # manifest, depend upward.
    "configuration",
    # Shared symbol DEFINITIONS, mounting nothing at all (156 lines,
    # zero mounts). Four files in math's algebraic core name them, and
    # the answer to "the core reaches up into its own superstructure" is
    # that definitions shared by both belong BELOW both — not that the
    # core should move up.
    "math.frameworks.msfs.key_symbols",
    # Identifier generators, formerly `core/base/{uuid,ulid,nanoid,
    # snowflake}.vr`. They read a wall clock and draw entropy, which is
    # what the ring law measured as `base(r0) -> time.system_time(r2)`.
    # `core.base.snowflake` claimed a Snowflake ID is a primitive of the
    # LANGUAGE, next to Maybe and Result; it is not.
    "id",
]

[ring.3]
name = "runtime"
# Execution services built on the system layer.
modules = [
    "async", "concurrency", "runtime", "context", "control",
    "tracing", "metrics", "signal", "cache", "action", "eval",
    # These two are applied, not algebraic: `distributed` mounts
    # `async.channel`, `stack_model` mounts `action.articulation`. They
    # sit in `math/` by topic and belong to the runtime layer by
    # dependency.
    "math.distributed", "math.stack_model",
    # A COORDINATE VOCABULARY — `Ordinal`, `MsfsCoord` and their
    # constructors (467 lines) — mounting only `action.articulation`.
    # `math.frameworks.registry` names those coordinates and
    # `theory_interop` is built on them, so the two appeared to depend
    # on each other; the shared definitions simply sat on the wrong
    # side. Same shape as `math.frameworks.msfs.key_symbols` and
    # `collections.graph`: what both need belongs below both.
    "theory_interop.coord",
    # OS thread primitives and a thread pool. `thread.vr` mounts
    # `intrinsics.type_info` and `time`; `pool.vr` mounts only the
    # prelude — neither needs anything from ring 3.
    #
    # They sat in `runtime` alongside `spawn` and `supervisor`, which
    # are built ON the async layer, so one directory spanned both sides
    # of it: `async.executor -> runtime.thread` and
    # `async.task -> runtime.pool` went down while
    # `runtime.spawn -> async` went up, and the pair read as a cycle.
    # Async is BUILT ON threads; the threads are not part of it.
    "runtime.thread", "runtime.pool",
]

[ring.4]
name = "language-services"
# Compile-time and toolchain-facing services.
modules = ["meta", "cog", "proof", "verify", "archive", "script", "diagnostics"]

[ring.5]
name = "domain"
# Complete application subsystems. §2 category 3: these are in core/ for
# historical reasons — measured connectivity to rings 0–4 is ~zero — and
# are the candidates for extraction into cog packages (§5.3, §5.4).
modules = [
    "database", "net", "security", "term", "shell", "cli", "mesh",
    # `storage` is mod.vr + types.vr + s3/ — an object-store network
    # client, not a container algorithm. Ring 2 was a topical placement
    # ("storage sounds like data"), and it turned two ordinary lateral
    # edges — storage -> net.http, storage -> security.aws_credentials —
    # into law violations.
    "storage",
    # The applied superstructure of `math`. frameworks/ and foundations/
    # mount core.action.{articulation,enactments} (ring 3),
    # core.theory_interop.coord (ring 5) and core.proof.kernel_bridge
    # (ring 4); the algebraic core stays at ring 2.
    #
    # This does NOT reduce the violation count, and that is the point.
    # It converts 12 diffuse "math is above its ring" sites into 2
    # precise ones: `math/meta_cls.vr:37` and `math/syn_mod.vr:82` mount
    # `core.math.frameworks.msfs.key_symbols` — the algebraic core
    # reaching UP into its own superstructure. That edge is a real
    # design defect; leaving frameworks at ring 2 merely hid it inside a
    # larger number.
    "math.frameworks", "math.foundations",
    # An adapter sits above both things it adapts, by construction:
    # cache/adapters/redis.vr binds the CacheBackend protocol to
    # core.redis.
    "cache.adapters",
    "redis", "protobuf", "search", "compress", "money",
    "architecture", "theory_interop",
]

[ring."5.5"]
name = "integration-client"
# Modules that TALK to a remote service. They sit above `net` because
# they USE it — the other half of the net <-> security cycle, which was
# never one cycle but two directions with different natures: `net`
# needs cryptographic ALGORITHMS (now in rings 1.5), while these need
# a network CLIENT.
#
# Each name is honest — fetching a CRL is security work — so the files
# stay in `security/`, and only their layer is corrected. The file
# names already said it: `crl_client.vr`, `ocsp_client.vr`.
modules = [
    # Only the CLIENT of each pair. `security.spiffe.id` and
    # `.svid` are identity TYPES that `net.weft` legitimately names;
    # `.workload_api` is the thing that opens a Unix socket. Splitting
    # them here is the same distinction the ring law keeps finding:
    # a data type and the client that fetches it are different layers
    # even when they share a directory.
    "security.spiffe.workload_api",
    # Revocation checking is a network round-trip: crl_client and
    # ocsp_client mount net.http, and `verifier` mounts both. Only
    # `security.sigstore.verify` consumes them, and it is already here.
    # Certificate PARSING stays in ring 5 — that is what `net.h3` needs,
    # and it needs no network.
    "security.x509.crl_client",
    "security.x509.ocsp_client",
    "security.x509.verifier",
    "security.sigstore",
    "security.tuf",
    "security.oidc",
    "security.transparency_log",
]
