[package]
name = "verum_proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Portable Verum native proof-term replay, without compiler or solver dependencies"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
blake3 = "1"
tempfile = { version = "3", optional = true }
sysinfo = { version = "0.37.2", default-features = false, features = ["system"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["resource"], optional = true }

[features]
process = ["dep:tempfile", "dep:nix", "dep:sysinfo"]

[[bin]]
name = "verum-proof"
path = "src/main.rs"
required-features = ["process"]

[dev-dependencies]
proptest = "1"
