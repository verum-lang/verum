[package]
name = "verum_source_proof"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Scoped Verum source elaboration into portable native proof judgments"
build = "build.rs"

[dependencies]
verum_proof = { path = "../verum_proof", features = ["process"] }
verum_fast_parser = { path = "../verum_fast_parser" }
verum_ast = { path = "../verum_ast" }
verum_common = { path = "../verum_common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "verum-source-replay"
path = "src/main.rs"
